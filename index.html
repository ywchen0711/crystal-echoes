<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>水晶迴響 Crystal Echoes</title>
<meta name="description" content="HD-2D 像素風回合制 RPG：破防、追加階段、共鳴、迴響水晶與召喚獸。">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="area"></div>
  <div id="objective" style="display:none"></div>
  <div id="danger"><i></i></div>
  <div id="hudbottom"><div id="hudparty"></div><div id="hudgil"></div></div>
</div>

<div id="battle"></div>
<div id="dialog"></div>
<div id="ui"></div>
<div id="toasts"></div>

<div id="touch">
  <div id="tzone"></div>
  <div id="tpad"><div id="tknob"></div></div>
  <div class="tbtns">
    <button data-k="menu" class="tb tb-menu">☰</button>
    <button data-k="mount" class="tb tb-mount">🐦</button>
    <button data-k="cancel" class="tb tb-b">B</button>
    <button data-k="ok" class="tb tb-a">A</button>
  </div>
</div>

<div id="swirl"></div>
<div id="fade"></div>
<div id="chapter"></div>
<div id="gameover"></div>
<div id="ending"></div>

<div id="title">
  <div class="tt-logo">
    <div class="tt-gem"></div>
    <h1>水晶迴響</h1>
    <div class="tt-en">CRYSTAL ECHOES</div>
  </div>
  <div class="tt-menu"></div>
  <div class="tt-help">鍵盤：方向鍵移動　Z / Enter 確定　X / Esc 取消　C 選單　Shift 跑步　R 坐騎<br>平板：左半邊拖曳移動，右下角按鈕操作</div>
</div>

<script type="module" src="js/main.js?v=2"></script>
</body>
</html>
